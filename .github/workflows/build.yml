name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -o source.zip -d _src
          cp -a _src/AnimeTV/. .
          rm -rf _src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        run: echo "${{ secrets.ANIMETV_KS_B64 }}" | base64 -d > "$RUNNER_TEMP/animetv.p12"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANIMETV_KS_FILE: ${{ runner.temp }}/animetv.p12
          ANIMETV_KS_PASS: ${{ secrets.ANIMETV_KS_PASS }}
          ANIMETV_KEY_ALIAS: animetv
          ANIMETV_KEY_PASS: ${{ secrets.ANIMETV_KS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk
